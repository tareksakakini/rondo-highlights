name: Refresh clock

# Starts "Refresh data" (refresh-data.yml) when the data needs it: every ~10 min
# while matches finish, every few hours otherwise, a full run once a day. See
# scripts/refresh-clock.mjs and scripts/lib/refresh-plan.mjs.
#
# Each run is one tick: check once, start a refresh if one is due, exit. The ticks
# come from a cron-job.org job every 10 minutes, not from GitHub's scheduler, which
# drops many scheduled runs (and once fired none for 4 hours). The job POSTs to
#   https://api.github.com/repos/<owner>/<repo>/actions/workflows/refresh-clock.yml/dispatches
# with body {"ref":"main"} and a fine-grained token (this repo, Actions: read and
# write). If the ticks stop, refresh-data.yml's own 3-hourly backup timer still
# refreshes.

on:
  workflow_dispatch:

permissions:
  actions: write   # start refresh-data.yml (and see which runs are going)
  contents: read

# One tick at a time, so two can't both start a refresh.
concurrency:
  group: refresh-clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start a refresh if one is due
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/refresh-clock.mjs
