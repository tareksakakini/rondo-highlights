name: Refresh data

# Fetch fixtures + highlights and commit any changes to the `data` branch. The
# live site reads that branch through jsDelivr's CDN, so new highlights need no
# redeploy. The prerendered competition/round pages are the exception: the last
# step redeploys when they would change (rarely). Code changes on `main` are
# built and deployed by Netlify as usual.
#
# No schedule of its own: the refresh clock (refresh-clock.yml) starts it when
# matches finish (quick runs every ~10 min, only the competitions involved),
# every few hours otherwise, and once a day as a full run. Start one by hand from
# the Actions tab or with `npm run refresh` (a full run unless you pick quick).

run-name: "Refresh data · ${{ inputs.mode || 'full' }}${{ inputs.reason && format(' · {0}', inputs.reason) || '' }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = 10 days of uploads from every channel, every stored video re-checked (~150 YouTube units). quick = only the newest uploads (what the clock runs while matches finish).'
        type: choice
        options: [full, quick]
        default: full
      reason:
        description: 'Why this run (shown in its title). The clock fills this in.'
        required: false
        default: ''
      since:
        description: 'Backfill uploads from this date (YYYY-MM-DD). Blank = last 10 days.'
        required: false
        default: ''
      fresh:
        description: 'Rebuild these competitions from scratch, forgetting earlier matches, e.g. EL,UNL (use with since). Blank = keep.'
        required: false
        default: ''
      only:
        description: 'Only these competitions, e.g. WC (also re-ingests finished tournaments). Blank = all.'
        required: false
        default: ''
      condense_max:
        description: 'Condensed cuts: how many YouTube watch pages to read this run (default 40). Raise once to backfill, e.g. 300.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch into public/data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add public/data FETCH_HEAD
          else
            git worktree add --orphan -b data public/data
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Fetch fixtures + highlights
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          MODE: ${{ inputs.mode }}
          SINCE: ${{ inputs.since }}
          FRESH: ${{ inputs.fresh }}
          ONLY: ${{ inputs.only }}
        run: |
          ARGS=""
          if [ "$MODE" = quick ]; then ARGS="$ARGS --quick"; fi
          if [ -n "$SINCE" ]; then ARGS="$ARGS --since=$SINCE"; fi
          if [ -n "$FRESH" ]; then ARGS="$ARGS --fresh=$FRESH"; fi
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only=$ONLY"; fi
          npm run ingest -- $ARGS

      - name: Self-host small crests
        run: npm run crests

      # Key moments of extended cuts, from YouTube's chapters (public/data/condensed.json):
      # the site plays them in place of a missing short cut. Never blocks the refresh:
      # delete this step to switch it off.
      - name: Condensed cuts (experimental)
        continue-on-error: true
        timeout-minutes: 12
        env:
          CONDENSE_MAX: ${{ inputs.condense_max }}
        run: npm run condense

      - name: Commit to the data branch and refresh the CDN
        id: publish
        working-directory: public/data
        run: |
          commit() {
            git -c user.name="rondo-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "$1"
          }
          stamp=$(date -u +'%Y-%m-%d %H:%M UTC')
          start=$(git rev-parse --verify -q HEAD || echo none)

          # 1. Round files and crests. The site reads these from this exact commit
          #    (jsDelivr @<sha>), which is cached forever, so they never need purging.
          git add -A -- . ':(exclude)index.json'
          visible=no
          git diff --cached --quiet -- . ':(exclude)cache' || visible=yes   # cache/ is internal
          if ! git diff --cached --quiet; then
            commit "data: refresh highlights $stamp"
          fi
          # What the index on the branch names now (index.json isn't in the commit above).
          named() {
            git show HEAD:index.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s)[process.argv[1]]||"")}catch{}})' "$1"
          }
          if [ "$visible" = yes ]; then
            rev=$(git rev-parse HEAD)
          else
            # Nothing the site reads changed: keep the commit the index already names,
            # so visitors' cached round files stay valid.
            rev=$(named rev)
            [ -n "$rev" ] || rev=$(git rev-parse HEAD)
          fi
          # Crests never change once stored, so the site reads them at the last commit that
          # added one: refreshes that add none keep their URLs, and visitors' caches.
          if [ "$start" = none ] || ! git diff --quiet "$start" HEAD -- crests; then
            crests_rev=$(git rev-parse HEAD)
          else
            crests_rev=$(named crestsRev)
            [ -n "$crests_rev" ] || crests_rev=$rev
          fi

          # 2. index.json names those commits. It is the only file read from the moving branch.
          node ../../scripts/stamp-rev.mjs index.json "$rev" "$crests_rev"
          git add index.json
          index_changed=no
          if ! git diff --cached --quiet; then
            commit "data: index for $stamp"
            index_changed=yes
          fi

          if [ "$(git rev-parse HEAD)" = "$start" ]; then
            echo "No new highlights."
            exit 0
          fi
          git push origin HEAD:data
          [ "$index_changed" = yes ] || exit 0
          # jsDelivr caches branch files for up to 12 h; purge the index so visitors see it now.
          curl -fsS -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/index.json" \
            && echo "purged index.json" || echo "purge failed for index.json (will expire on its own)"
          echo "warm=yes" >> "$GITHUB_OUTPUT"

      # Ask jsDelivr for what visits read (index.json, every round file at the new
      # commit, condensed.json; current rounds and their crests first), so the CDN fetches them
      # from GitHub now rather than while the next visitor waits. Also re-purges
      # index.json if jsDelivr still serves the old one. Never blocks the refresh.
      - name: Warm the CDN
        if: steps.publish.outputs.warm == 'yes'
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/warm-cdn.mjs public/data

      # The site's prerendered pages (competitions, rounds, who plays whom) are built
      # from this data when Netlify deploys. Redeploy only when what they show changed,
      # and at most about once a day: each production deploy costs Netlify credits.
      # Needs the NETLIFY_BUILD_HOOK secret; without it, this step only logs a warning.
      - name: Redeploy the site if its pages changed
        continue-on-error: true
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: node scripts/check-pages.mjs public/data
