name: Refresh highlights

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours (UTC)
  workflow_dispatch:
    inputs:
      since:
        description: 'Backfill uploads from this date (YYYY-MM-DD). Leave blank for the last 10 days.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Fetch fixtures + highlights
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then npm run ingest -- --since="$SINCE"; else npm run ingest; fi

      - name: Commit data if it changed (Netlify redeploys on push)
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "No new highlights."
            exit 0
          fi
          git -c user.name="rondo-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "data: refresh highlights $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
