name: Refresh & deploy

# - Every 2 hours: fetch new highlights; if anything changed, commit the data and deploy.
# - On every push to main (code changes): build and deploy.
# - Manually (Actions → Run workflow): optional backfill date; always deploys.

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours (UTC); GitHub may delay scheduled runs
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      since:
        description: 'Backfill uploads from this date (YYYY-MM-DD). Blank = last 10 days.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

env:
  CF_PROJECT: rondo-highlights

jobs:
  refresh-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Fetch fixtures + highlights
        id: ingest
        if: github.event_name != 'push'
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ -n "$SINCE" ]; then npm run ingest -- --since="$SINCE"; else npm run ingest; fi
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new highlights."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new data
        if: steps.ingest.outputs.changed == 'true'
        run: |
          git -c user.name="rondo-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "data: refresh highlights $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Build
        if: github.event_name != 'schedule' || steps.ingest.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'schedule' || steps.ingest.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy dist --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
