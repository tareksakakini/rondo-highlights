    <title>Rondo Highlights · Football highlights, back to back</title>
    <!--
      Startup wheel: the logo's pass circles the play button until the stylesheet has
      loaded, instead of a blank screen. The build moves the stylesheet link to just after
      the wheel (vite.config.ts, startupWheel), so the wheel shows as soon as the page
      starts arriving; the stylesheet then fades it out and shows #root (styles.css,
      "Startup wheel"). #root stays hidden until then in any case.
    -->
    <style>
      html { background: #0b0f14; }
      body { margin: 0; }
      #root { visibility: hidden; }
      .boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0b0f14; }
      .boot-mark { position: relative; width: 64px; height: 64px; }
      .boot-mark svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* An HTML element's transform, so the browser can spin it off the main thread. */
      .boot-pass { animation: boot-spin .9s linear infinite; will-change: transform; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-pass { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div class="boot" aria-hidden="true">
      <div class="boot-mark">
        <svg class="boot-pass" viewBox="0 0 48 48" fill="none">
          <path d="M39.59 15A18 18 0 1 1 11.96 10.62" fill="none" stroke="#e8eef4" stroke-width="3.6" stroke-linecap="round" />
          <circle cx="32.45" cy="8.11" r="4.6" fill="#c8f550" />
        </svg>
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M19.5 16.5 32 24 19.5 31.5Z" fill="#c8f550" stroke="#c8f550" stroke-width="3" stroke-linejoin="round" />
        </svg>
      </div>
    </div>
    <!-- rondo:stylesheet -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
