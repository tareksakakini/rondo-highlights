# Netlify builds the static site from this repo on every push.
# Fresh highlight data arrives as commits from .github/workflows/refresh-data.yml.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Data changes every few hours — always revalidate.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # YouTube embeds need at least the origin as referrer.
    Referrer-Policy = "strict-origin-when-cross-origin"
