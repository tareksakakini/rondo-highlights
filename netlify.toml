# Netlify builds the site from `main` only. Highlight data is NOT part of the
# build: the site fetches it at runtime from the repo's `data` branch (see
# vite.config.ts and .github/workflows/refresh-data.yml), so data refreshes cost
# no deploys. Response headers are in public/_headers.

[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (each production deploy costs credits) when a push only touches
  # what the site never uses: workflows, docs, tests, the refresh pipeline's own
  # scripts, and the Firebase rules (deployed with the Firebase CLI). ignore exits 0
  # to skip; on a first build there's no cached commit, so git diff fails and the build runs.
  ignore = 'git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . :!.github :!README.md :!docs :!tests :!scripts/refresh-clock.mjs :!scripts/lib/refresh-plan.mjs :!scripts/warm-cdn.mjs :!scripts/stamp-rev.mjs :!scripts/check-pages.mjs :!firestore.rules :!firebase.json :!.firebaserc'

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secrets scan fails the build on the Firebase web key in
  # src/lib/firebase-config.ts. That key is public by design (it names the project;
  # firestore.rules decide what each account may do), so let this one value through and
  # keep scanning for everything else.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCC48S2ElaUA0m7pK-yxSBdkJqzxSyrvGg"

# "My teams" (beta) is drawn by the app, so it's served the home page with a 200
# (not the 404 page). It only applies when no file exists at the path.
[[redirects]]
  from = "/my-teams/"
  to = "/index.html"
  status = 200

# One canonical host: https://rondohighlights.com. Everything else 301s there
# (path kept), so search engines index one copy of the site and share links
# agree. Netlify already sends http -> https; the http rules save a hop.
# public/_redirects (generated, for /geo.json only) is applied before these.
[[redirects]]
  from = "https://www.rondohighlights.com/*"
  to = "https://rondohighlights.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.rondohighlights.com/*"
  to = "https://rondohighlights.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://rondo-highlights.netlify.app/*"
  to = "https://rondohighlights.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://rondo-highlights.netlify.app/*"
  to = "https://rondohighlights.com/:splat"
  status = 301
  force = true
