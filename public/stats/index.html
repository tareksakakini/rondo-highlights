<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Rondo stats</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<!--
  Private dashboard for our own analytics (netlify/functions/stats.mjs, which needs the
  STATS_KEY set in Netlify). The key is kept in this browser's localStorage, and opening
  this page marks the browser rondo:notrack so your own visits aren't counted.
-->
<style>
  :root {
    --bg: #0b0f14; --surface: #121821; --surface-2: #19212c; --line: #243040;
    --text: #e8eef4; --muted: #8a97a6; --accent: #c8f550; --accent-dim: #5d7225; --danger: #ff6b6b;
    --radius: 14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: 24px 16px 48px;
  }
  main { max-width: 1040px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h1 a { color: inherit; text-decoration: none; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button, input {
    font: inherit; color: inherit; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.on { background: var(--accent); color: #11160a; border-color: var(--accent); font-weight: 600; }
  .ranges { display: flex; gap: 6px; flex-wrap: wrap; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 14px; }
  .kpi .label { font-size: 13px; color: var(--muted); }
  .kpi .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
  tr:first-child td { border-top: 0; }
  td.n { text-align: right; padding-left: 12px; white-space: nowrap; }
  td.k { word-break: break-word; position: relative; }
  td.k .bar { position: absolute; inset: 3px auto 3px 0; background: var(--surface-2); border-radius: 4px; z-index: 0; }
  td.k span { position: relative; z-index: 1; padding-left: 6px; }
  .empty { color: var(--muted); font-size: 13px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .login { max-width: 420px; margin: 12vh auto 0; }
  .login form { display: flex; gap: 8px; margin-top: 14px; }
  .login input { flex: 1; min-width: 0; border-radius: 10px; }
  .err { color: var(--danger); margin-top: 10px; font-size: 14px; }
  .sub { margin-top: 18px; }
  .sub h3 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
  .back { margin-top: 14px; }
  .back .kpis { margin: 4px 0 18px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .back .kpi { background: var(--surface-2); }
  .cohorts { overflow-x: auto; margin-top: 18px; }
  .cohorts table { min-width: 560px; }
  .cohorts th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: right; padding: 0 0 6px 4px; white-space: nowrap; }
  .cohorts th:first-child { text-align: left; }
  .cohorts td { text-align: right; padding: 2px 0 2px 4px; white-space: nowrap; font-size: 13px; }
  .cohorts td:first-child { text-align: left; }
  .cohorts td.c span { display: block; border-radius: 4px; padding: 3px 6px; }
  .watch { margin-top: 14px; }
  .watch .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .watch .top h2 { margin: 0; }
  .watch .ranges button { padding: 4px 11px; font-size: 13px; }
  .watch .kpis { margin: 0 0 14px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .watch .kpi { background: var(--surface-2); }
  .watch .bin:hover rect { filter: brightness(1.25); }
  footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
  footer button { padding: 4px 10px; font-size: 13px; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
(() => {
  const KEY = 'rondo:stats-key';
  const app = document.getElementById('app');
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    del: (k) => { try { localStorage.removeItem(k); } catch {} },
  };
  let days = Number(store.get('rondo:stats-days')) || 7;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n) => Number(n).toLocaleString('en-US');
  const pct = (a, b) => (b ? `${Math.round((100 * a) / b)}%` : '–');
  let regionNames = null;
  try { regionNames = new Intl.DisplayNames(['en'], { type: 'region' }); } catch {}
  const country = (cc) => {
    if (!/^[A-Z]{2}$/.test(cc)) return 'Unknown';
    try { return regionNames?.of(cc) ?? cc; } catch { return cc; }
  };
  const COMPS = { PL: 'Premier League', PD: 'La Liga', SA: 'Serie A', BL1: 'Bundesliga', FL1: 'Ligue 1', CL: 'Champions League', EL: 'Europa League', UNL: 'Nations League', WC: 'World Cup', EC: 'Euros' };
  const LABELS = {
    from: { all: 'Play all', card: 'A match card', queue: 'The queue', suggestion: 'A suggestion' },
    cut: { short: 'Short', extended: 'Extended', condensed: 'Auto-condensed' },
  };
  const label = (prop, v) => (prop === 'comp' ? COMPS[v] ?? v : prop === 'country' && v !== 'auto' ? country(v) : LABELS[prop]?.[v] ?? v);

  function login(error) {
    app.innerHTML = `
      <div class="login card">
        <h1>Rondo stats</h1>
        <p class="muted small">Enter the key you set as <code>STATS_KEY</code> in Netlify. It's kept in this browser, and visits from this browser stop being counted.</p>
        <form><input type="password" autocomplete="current-password" placeholder="Stats key" required /><button class="on">Open</button></form>
        ${error ? `<div class="err">${esc(error)}</div>` : ''}
      </div>`;
    const form = app.querySelector('form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      store.set(KEY, form.querySelector('input').value.trim());
      load();
    });
    form.querySelector('input').focus();
  }

  async function load() {
    const key = store.get(KEY);
    if (!key) return login();
    let res;
    try {
      res = await fetch(`/api/stats?days=${days}`, { headers: { Authorization: `Bearer ${key}` } });
    } catch {
      return login('Could not reach the stats endpoint.');
    }
    const body = await res.json().catch(() => ({}));
    if (res.status === 401) { store.del(KEY); return login('That key is wrong.'); }
    if (!res.ok) return login(body.error || `Error ${res.status}`);
    store.set('rondo:notrack', '1');
    render(body);
  }

  function table(rows, fmt = (k) => k, empty = 'Nothing yet') {
    if (!rows || !rows.length) return `<div class="empty">${empty}</div>`;
    const max = rows[0][1] || 1;
    return `<table>${rows.map(([k, n]) => `
      <tr><td class="k"><div class="bar" style="width:${Math.max(2, (100 * n) / max)}%"></div><span>${esc(fmt(k))}</span></td><td class="n">${num(n)}</td></tr>`).join('')}</table>`;
  }

  const shortDay = (d) => new Date(`${d}T00:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });

  // Bars of `whole` per day with `part` of it on top; `tip(row, day)` is each day's tooltip.
  function chart(daily, whole = 'visitors', part = 'watchers', tip = (d, day) => `${day}: ${d.visitors} visitors, ${d.watchers} watched highlights, ${d.views} page views`) {
    const W = 960, H = 220, top = 10, bottom = 26, left = 34;
    const max = Math.max(4, ...daily.map((d) => d[whole]));
    const step = Math.pow(10, Math.floor(Math.log10(max)));
    const ceil = Math.ceil(max / step) * step;
    const y = (v) => top + (H - top - bottom) * (1 - v / ceil);
    const bw = (W - left) / daily.length;
    const barW = Math.max(2, Math.min(36, bw * 0.7));
    const ticks = [0, ceil / 2, ceil];
    const every = Math.ceil(daily.length / 10);
    const bars = daily.map((d, i) => {
      const x = left + i * bw + (bw - barW) / 2;
      const day = shortDay(d.day);
      return `
        <g><title>${tip(d, day)}</title>
          <rect x="${x}" y="${y(d[whole])}" width="${barW}" height="${y(0) - y(d[whole])}" rx="3" fill="var(--accent-dim)" />
          <rect x="${x}" y="${y(d[part])}" width="${barW}" height="${y(0) - y(d[part])}" rx="3" fill="var(--accent)" />
          ${i % every === 0 ? `<text x="${x + barW / 2}" y="${H - 6}" text-anchor="middle" font-size="12" fill="var(--muted)">${day}</text>` : ''}
        </g>`;
    }).join('');
    const grid = ticks.map((t) => `
      <line x1="${left}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" />
      <text x="${left - 8}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${num(t)}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${whole === 'visitors' ? 'Visitors' : 'Visitors we could tell'} per day">${grid}${bars}</svg>`;
  }

  // Did visitors come back: returning share, day-N retention and a table of first-visit days.
  function comingBack(s) {
    const t = s.totals;
    const told = t.fresh + t.back;
    const daily = s.daily.map((d) => ({ ...d, told: d.fresh + d.back }));
    const r = s.retention;
    const rate = (n, text) => {
      const x = r.rates[n];
      const value = x && x.of ? pct(x.back, x.of) : '–';
      const note = !x ? `Needs a range over ${n + 1} days` : x.of ? `${num(x.back)} of ${num(x.of)} new visitors` : 'No new visitors to follow yet';
      return `<div class="card kpi"><div class="label">${text}</div><div class="value">${value}</div><div class="note">${note}</div></div>`;
    };
    const cohorts = r.cohorts.slice(-14).reverse();
    const cell = (n, size) => {
      if (n === null) return '<td class="c"></td>';
      if (!size) return '<td class="c muted">–</td>';
      const share = n / size;
      return `<td class="c" title="${num(n)} of ${num(size)}"><span style="background:rgba(200,245,80,${(0.08 + 0.6 * Math.min(1, share * 2)).toFixed(2)});${share > 0.4 ? 'color:#11160a;' : ''}">${pct(n, size)}</span></td>`;
    };
    const days = Array.from({ length: cohorts[0]?.back.length ?? 0 }, (_, k) => k + 1);
    const grid = cohorts.length && cohorts.some((c) => c.size) ? `
      <div class="cohorts">
        <h3 class="small">Of each day's new visitors, the share back N days later</h3>
        <table>
          <tr><th>First visit</th><th>New</th>${days.map((k) => `<th>Day ${k}</th>`).join('')}</tr>
          ${cohorts.map((c) => `<tr><td>${shortDay(c.day)}</td><td>${num(c.size)}</td>${c.back.map((n) => cell(n, c.size)).join('')}</tr>`).join('')}
        </table>
      </div>` : `<p class="empty">${s.daily.length > 2 ? 'No new visitors to follow yet.' : 'Pick 7 days or more to follow new visitors day by day.'}</p>`;
    return `
      <div class="card back">
        <h2>Coming back</h2>
        <div class="grid kpis">
          <div class="card kpi"><div class="label">Returning visitors</div><div class="value">${pct(t.back, told)}</div><div class="note">${num(t.back)} of ${num(told)} had been here before</div></div>
          ${rate(1, 'Back the next day')}
          ${rate(7, 'Back a week later')}
          ${rate(30, 'Back a month later')}
        </div>
        <div class="legend"><span><i style="background:var(--accent-dim)"></i>New</span><span><i style="background:var(--accent)"></i>Returning</span></div>
        ${chart(daily, 'told', 'back', (d, day) => `${day}: ${d.fresh} new, ${d.back} returning`)}
        ${grid}
        <p class="muted small">Counted per browser: a cleared browser, a private window or another device looks new. Browsers that visited before this started count as returning, but aren't in the day-N figures. Today is still counting, so it isn't used as a return day.</p>
      </div>`;
  }

  // How long each highlight was watched: one bar per minute, the part played to the end on top.
  let watchCut = store.get('rondo:stats-watchcut') || 'all';
  const CUT_KEYS = ['short', 'extended', 'condensed'];
  const minLabel = (m, max) => (m === 0 ? 'Under 1 min' : m >= max ? `${max} min or more` : `${m}–${m + 1} min`);

  function watchBins(w, cut) {
    const keys = cut === 'all' ? CUT_KEYS : [cut];
    return w.bins.map((b, m) => keys.reduce((t, k) => ({ m, n: t.n + b[k][0], ended: t.ended + b[k][1] }), { m, n: 0, ended: 0 }));
  }

  function histogram(bins, max) {
    // Drawn at about the width it's shown, so the labels stay legible on a phone.
    const W = Math.round(Math.min(960, Math.max(300, (app.querySelector('.watch-body')?.clientWidth || 960)))), H = 240, top = 10, bottom = 44, left = 34;
    const most = Math.max(4, ...bins.map((b) => b.n));
    const step = Math.pow(10, Math.floor(Math.log10(most)));
    const ceil = Math.ceil(most / step) * step;
    const y = (v) => top + (H - top - bottom) * (1 - v / ceil);
    const bw = (W - left) / bins.length;
    const barW = Math.max(2, bw - 4);
    const every = bw < 24 ? 2 : 1;
    const grid = [0, ceil / 2, ceil].map((t) => `
      <line x1="${left}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" />
      <text x="${left - 8}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${num(t)}</text>`).join('');
    const bars = bins.map((b) => {
      const x = left + b.m * bw + 2;
      const tick = b.m === 0 ? '<1' : b.m >= max ? `${max}+` : String(b.m);
      return `
        <g class="bin"><title>${minLabel(b.m, max)}: ${num(b.n)} ${b.n === 1 ? 'watch' : 'watches'}${b.n ? `, ${num(b.ended)} to the end (${pct(b.ended, b.n)})` : ''}</title>
          <rect x="${x - 2}" y="${top}" width="${bw}" height="${y(0) - top}" fill="transparent" />
          ${b.n ? `<rect x="${x}" y="${y(b.n)}" width="${barW}" height="${y(0) - y(b.n)}" rx="3" fill="var(--accent-dim)" />` : ''}
          ${b.ended ? `<rect x="${x}" y="${y(b.ended)}" width="${barW}" height="${y(0) - y(b.ended)}" rx="3" fill="var(--accent)" />` : ''}
          ${b.m % every === 0 || b.m === max ? `<text x="${x + barW / 2}" y="${H - 26}" text-anchor="middle" font-size="12" fill="var(--muted)">${tick}</text>` : ''}
        </g>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Highlights by minutes watched">${grid}${bars}
      <text x="${left + (W - left) / 2}" y="${H - 4}" text-anchor="middle" font-size="12" fill="var(--muted)">Minutes watched (3 means 3:00 to 3:59)</text></svg>`;
  }

  function watchBody(w) {
    const bins = watchBins(w, watchCut);
    const n = bins.reduce((t, b) => t + b.n, 0);
    if (!n) return `<p class="empty">No watches${watchCut === 'all' ? '' : ' of this cut'} in this range yet. Watch lengths are counted from the release that added this chart.</p>`;
    const ended = bins.reduce((t, b) => t + b.ended, 0);
    let seen = 0;
    const median = bins.find((b) => (seen += b.n) >= n / 2).m;
    return `
      <div class="grid kpis">
        <div class="card kpi"><div class="label">Typical watch</div><div class="value">${median === 0 ? '<1' : median >= w.max ? `${w.max}+` : `${median}–${median + 1}`}<span class="small muted"> min</span></div><div class="note">Half of watches were shorter</div></div>
        <div class="card kpi"><div class="label">Under a minute</div><div class="value">${pct(bins[0].n, n)}</div><div class="note">${num(bins[0].n)} of ${num(n)} watches</div></div>
        <div class="card kpi"><div class="label">Played to the end</div><div class="value">${pct(ended, n)}</div><div class="note">${num(ended)} of ${num(n)} watches</div></div>
      </div>
      <div class="legend"><span><i style="background:var(--accent-dim)"></i>Stopped before the end</span><span><i style="background:var(--accent)"></i>Played to the end</span></div>
      ${histogram(bins, w.max)}`;
  }

  function watchCard(s) {
    const w = s.watch;
    if (!w) return '';
    const cuts = [['all', 'All cuts'], ...CUT_KEYS.map((k) => [k, LABELS.cut[k]])];
    return `
      <div class="card chart watch">
        <div class="top">
          <h2>How long highlights were watched</h2>
          <div class="ranges">${cuts.map(([k, text]) => `<button data-cut="${k}" class="${watchCut === k ? 'on' : ''}">${text}</button>`).join('')}</div>
        </div>
        <div class="watch-body">${watchBody(w)}</div>
        <p class="muted small">One watch per highlight played: the time it was actually playing (pauses and buffering left out), until the viewer moved on, closed it or left the page. On phones, switching away from the tab ends the watch. Auto-condensed cuts count only the moments played.</p>
      </div>`;
  }

  function eventBlock(ev, props) {
    if (!ev) return '<div class="empty">Nothing yet</div>';
    return props.filter(([p]) => ev.by[p]?.length).map(([p, title]) => `
      <div class="sub"><h3>${title}</h3>${table(ev.by[p], (v) => label(p, v))}</div>`).join('') || '<div class="empty">Nothing yet</div>';
  }

  function render(s) {
    const t = s.totals;
    const ev = s.events;
    const finished = ev.finish?.n ?? 0;
    const settings = ev.setting ? Object.entries(ev.setting.by).flatMap(([name, vals]) => vals.map(([v, n]) => [`${name}: ${label(name, v)}`, n])).sort((a, b) => b[1] - a[1]) : [];
    const range = (n, text) => `<button data-days="${n}" class="${days === n ? 'on' : ''}">${text}</button>`;
    app.innerHTML = `
      <header>
        <h1><a href="/">Rondo</a> stats</h1>
        <div class="ranges">${range(1, 'Today')}${range(7, '7 days')}${range(30, '30 days')}${range(90, '90 days')}</div>
      </header>

      <div class="grid kpis">
        <div class="card kpi"><div class="label">Visitors</div><div class="value">${num(t.visitors)}</div><div class="note">${days > 1 ? 'Added up day by day' : 'Today'}</div></div>
        <div class="card kpi"><div class="label">Watched highlights</div><div class="value">${num(t.watchers)}</div><div class="note">${pct(t.watchers, t.visitors)} of visitors</div></div>
        <div class="card kpi"><div class="label">Highlights started</div><div class="value">${num(t.videos)}</div><div class="note">${t.watchers ? (t.videos / t.watchers).toFixed(1) : '–'} per watcher</div></div>
        <div class="card kpi"><div class="label">Watched to the end</div><div class="value">${pct(finished, t.videos)}</div><div class="note">${num(finished)} of ${num(t.videos)}</div></div>
        <div class="card kpi"><div class="label">Page views</div><div class="value">${num(t.views)}</div><div class="note">${t.visitors ? (t.views / t.visitors).toFixed(1) : '–'} per visitor</div></div>
        <div class="card kpi"><div class="label">Left after one page</div><div class="value">${pct(t.oneView, t.visitors)}</div><div class="note">Saw one page, played nothing</div></div>
      </div>

      <div class="card chart">
        <h2>Visitors per day</h2>
        <div class="legend"><span><i style="background:var(--accent-dim)"></i>Visitors</span><span><i style="background:var(--accent)"></i>Watched highlights</span></div>
        ${chart(s.daily)}
      </div>

      ${watchCard(s)}

      ${comingBack(s)}

      <div class="grid two">
        <div class="card"><h2>Where visitors came from</h2>${table(s.refs, (k) => k, 'No other sites yet')}<p class="muted small">Landings with no referring site (typed, bookmarks, apps) aren't listed.</p></div>
        <div class="card"><h2>Landing pages</h2>${table(s.entries)}</div>
        <div class="card"><h2>Pages viewed</h2>${table(s.pages)}</div>
        <div class="card"><h2>Countries</h2>${table(s.countries, country)}</div>
        <div class="card"><h2>Highlights started</h2>${eventBlock(ev.video, [['comp', 'By competition'], ['cut', 'By cut']])}</div>
        <div class="card"><h2>Play buttons pressed</h2>${eventBlock(ev.play, [['from', 'From'], ['comp', 'By competition']])}</div>
        <div class="card"><h2>Added to the queue</h2>${eventBlock(ev.queue, [['from', 'From'], ['comp', 'By competition']])}</div>
        <div class="card"><h2>Devices and settings</h2>${table(s.devices, (d) => d[0].toUpperCase() + d.slice(1))}
          <div class="sub"><h3>Settings changed</h3>${table(settings, (k) => k, 'None changed')}</div></div>
      </div>

      <footer>
        Days run midnight to midnight ${esc(s.tz ? s.tz.replace(/_/g, ' ') + ' time' : 'UTC')}. A visitor is counted once a day: the same person on two days counts twice.
        Bots that don't run JavaScript aren't counted. Visits from this browser are not counted.
        <button id="forget">Forget key</button>
      </footer>`;
    app.querySelectorAll('[data-days]').forEach((b) => b.addEventListener('click', () => {
      days = Number(b.dataset.days);
      store.set('rondo:stats-days', String(days));
      load();
    }));
    app.querySelectorAll('[data-cut]').forEach((b) => b.addEventListener('click', () => {
      watchCut = b.dataset.cut;
      store.set('rondo:stats-watchcut', watchCut);
      app.querySelectorAll('[data-cut]').forEach((o) => o.classList.toggle('on', o === b));
      app.querySelector('.watch-body').innerHTML = watchBody(s.watch);
    }));
    // The histogram is drawn to the card's width: again once it's on the page, and on resize.
    let lastW = 960;
    onresize = () => {
      const body = app.querySelector('.watch-body');
      if (!body || !s.watch || body.clientWidth === lastW) return;
      lastW = body.clientWidth;
      body.innerHTML = watchBody(s.watch);
    };
    onresize();
    app.querySelector('#forget').addEventListener('click', () => { store.del(KEY); login(); });
  }

  load();
})();
</script>
</body>
</html>
